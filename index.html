<title>Dispatcher Dashboard</title>
<style>
  :root {
    --bg-page: #f5f6f7;
    --bg-surface: #ffffff;
    --text-strong: #1d2d3e;
    --text-secondary: #556b82;
    --text-muted: #788fa6;
    --border-default: #d9d9d9;
    --border-row: #eaecee;
    --border-control: #bcc3ca;
    --accent: #0064d9;
    --accent-weak: #eaecee;
    --accent-wash: #e8f1fc;
    --warning: #b5590a;
    --warning-weak: #fdf1e4;
    --success: #0a7d3a;
    --success-weak: #e8f7ee;
    --success-soft: #8fc9a6;
    --accent-soft: #93b8e8;
    --capacity-actual: #6d97cf;
    --capacity-planned: #c3d6ef;
    --danger: #c22b2b;
    --danger-weak: #fbe9e9;
    --focus-ring: #0064d9;
    --shadow-color: 34, 53, 72;
  }

  * { box-sizing: border-box; }

  html, body {
    overflow-x: hidden;
  }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-strong);
    font-family: "Segoe UI", Arial, "Helvetica Neue", sans-serif;
    font-variant-numeric: tabular-nums;
  }

  button, input, select {
    font-family: inherit;
  }

  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 1px;
  }

  img.icon, svg.icon { display: block; }

  /* ---------- App header ---------- */
  .app-header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    box-shadow: 0 2px 1px rgba(var(--shadow-color), 0.05);
  }

  .app-header__bar {
    display: flex;
    align-items: center;
    height: 56px;
    padding: 0 48px;
    gap: 16px;
  }

  .app-header__title {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .app-header__actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .app-header__action-button {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg-surface);
    border: 1px solid var(--border-control);
    border-radius: 8px;
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .app-header__action-button:hover { background: #f7f8f9; }

  .app-header__nav {
    display: flex;
    gap: 32px;
    height: 44px;
    padding: 0 48px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
  }

  .app-header__tab {
    position: relative;
    display: flex;
    align-items: center;
    height: 100%;
    background: none;
    border: none;
    color: var(--text-strong);
    font-size: 14px;
    cursor: pointer;
  }

  .app-header__tab--active { color: var(--accent); font-weight: 700; }

  .app-header__tab--active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }

  /* ---------- Page header ---------- */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 48px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    flex-wrap: wrap;
    gap: 10px;
    position: relative;
  }

  .page-header__title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .page-header__filters {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .filter-field { display: flex; align-items: center; gap: 6px; position: relative; }
  .filter-field__label { font-size: 12px; color: var(--text-secondary); }
  .filter-field__divider { width: 1px; height: 16px; background: var(--border-default); }

  .filter-field__control {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: var(--bg-surface);
    border: 1px solid var(--border-control);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-strong);
    cursor: pointer;
  }

  .filter-field__control input {
    border: none;
    outline: none;
    font-size: 12px;
    color: var(--text-strong);
    width: 92px;
    background: transparent;
  }

  /* Date field: exactly one visible calendar icon (ours). The native browser
     indicator is stretched invisibly over the whole field so a click anywhere
     still opens the picker, instead of showing a second icon on the right. */
  .date-field { position: relative; }
  .date-field input[type="date"] {
    position: relative;
    z-index: 1;
    cursor: pointer;
  }
  .date-field input[type="date"]::-webkit-calendar-picker-indicator {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* ---------- Workspace layout ---------- */
  .workspace {
    display: flex;
    align-items: flex-start;
    width: 100%;
  }

  .workspace__main {
    flex: 1;
    min-width: 0;
  }

  .assignment-panel {
    width: 0;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-surface);
    border-left: 1px solid var(--border-default);
    transition: width 0.18s ease;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 149px);
    position: sticky;
    top: 0;
  }

  .assignment-panel--open { width: 360px; }

  #assignment-panel-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .assignment-panel__scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .assignment-panel__empty {
    padding: 32px 16px;
    color: var(--text-secondary);
    font-size: 13px;
    text-align: center;
  }

  .panel-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .panel-close:hover { background: var(--bg-page); }

  .panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 14px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border-row);
  }

  .panel-head__name { margin: 0; font-size: 16px; font-weight: 700; }
  .panel-head__sub { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }

  .panel-mode-banner {
    margin: 0 16px;
    padding: 6px 10px;
    background: var(--accent-wash);
    border-radius: 6px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }

  .util-block {
    border: 1px solid var(--border-row);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .util-block + .util-block { margin-top: 8px; }

  .util-block__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .util-block__row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .util-block__track {
    flex: 1;
    height: 8px;
    background: var(--accent-weak);
    border-radius: 9999px;
    overflow: hidden;
  }

  .util-block__fill {
    height: 8px;
    background: var(--accent);
    border-radius: 9999px;
  }

  .util-block__fill--warning { background: var(--warning); }

  .util-block__value {
    font-weight: 700;
    font-size: 13px;
    color: var(--accent);
    min-width: 34px;
    text-align: right;
  }

  .util-block__value--warning { color: var(--warning); }

  .util-block__sub {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .work-today {
    border: 1px solid var(--border-row);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .work-today__title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 8px;
  }

  .capacity-bar-outer { position: relative; }
  .capacity-bar {
    display: flex;
    height: 10px;
    border-radius: 9999px;
    background: var(--bg-page);
    overflow: hidden;
  }
  .capacity-bar__seg { height: 100%; flex-shrink: 0; }
  .capacity-bar__seg--actual { background: var(--capacity-actual); }
  .capacity-bar__seg--planned { background: var(--capacity-planned); }
  .capacity-bar__seg--projected {
    background-image: repeating-linear-gradient(135deg, var(--capacity-actual) 0 3px, var(--capacity-planned) 3px 6px);
  }
  .capacity-bar__seg--over { background: var(--warning); }
  .capacity-bar__tick {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 1px;
    background: var(--border-control);
  }
  .capacity-bar__tick-label {
    position: absolute;
    top: 100%;
    right: -2px;
    margin-top: 2px;
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .capacity-caption {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .capacity-warning {
    margin-top: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--warning);
  }

  /* Fixed-width so the bar never shifts between table rows regardless of label length.
     block (not inline-flex) so it hugs the cell's left edge instead of centering as an
     inline box; bar width is widened to roughly track the caption text beneath it. */
  .worktoday-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 148px; }
  .capacity-bar--compact { width: 148px; height: 6px; }
  .worktoday-cell__caption { font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; }

  .util-connector {
    display: flex;
    justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
    margin: 2px 0;
  }

  .mini-fields {
    display: flex;
    gap: 8px;
  }

  .mini-field {
    flex: 1;
    border: 1px solid var(--border-row);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .mini-field__label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .mini-field__value { font-size: 13px; font-weight: 700; margin-top: 2px; }

  .assigned-section__title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    margin: 0 0 8px;
  }

  .work-item {
    position: relative;
    border: 1px solid var(--border-row);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }

  .work-item + .work-item { margin-top: 6px; }

  .work-item--executed { background: var(--bg-page); }
  .work-item--executed .work-item__container { color: var(--text-secondary); }
  .work-item--executed .work-item__route,
  .work-item--executed .work-item__meta { color: var(--text-muted); }

  .work-item__container { font-weight: 700; font-size: 12.5px; color: var(--text-strong); display: block; }
  .work-item__route { font-size: 11.5px; color: var(--text-secondary); display: block; margin-top: 2px; }
  .work-item__meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }

  /* One shared Object Status pill family — used for Priority, Assignment Status
     and every Assigned Work status tag. Only the semantic modifier changes. */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 18px;
    padding: 0 7px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
  }
  .status-pill--neutral { background: var(--bg-page); color: var(--text-secondary); }
  .status-pill--positive { background: var(--success-weak); color: var(--success); }
  .status-pill--positive-subdued { background: var(--bg-page); color: var(--success); }
  .status-pill--info { background: var(--accent-wash); color: var(--accent); }
  .status-pill--warning { background: var(--warning-weak); color: var(--warning); }
  .status-pill--negative { background: var(--danger-weak); color: var(--danger); }

  .status-info-icon {
    display: inline-flex;
    background: none;
    border: none;
    padding: 0;
    color: var(--text-muted);
    font-size: 12px;
    cursor: help;
    line-height: 1;
  }

  .link-button-inline {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
  }

  .menu-button {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
  }
  .menu-button:hover { background: var(--bg-page); }

  .dropdown-menu {
    position: absolute;
    top: 28px;
    right: 0;
    z-index: 40;
    background: var(--bg-surface);
    border: 1px solid var(--border-control);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(var(--shadow-color), 0.18);
    min-width: 190px;
    padding: 6px;
  }

  .dropdown-menu__item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    padding: 7px 8px;
    background: none;
    border: none;
    border-radius: 6px;
    font-size: 12.5px;
    color: var(--text-strong);
    cursor: pointer;
  }
  .dropdown-menu__item:hover { background: var(--bg-page); }
  .dropdown-menu__item[disabled] { color: var(--text-muted); cursor: not-allowed; }
  .dropdown-menu__item[disabled]:hover { background: none; }

  .dropdown-menu__label {
    padding: 6px 8px 2px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .dropdown-menu__divider { height: 1px; background: var(--border-row); margin: 4px 2px; }

  .dropdown-submenu {
    position: relative;
  }
  .dropdown-submenu__panel {
    position: absolute;
    right: 100%;
    left: auto;
    top: -6px;
    z-index: 41;
    background: var(--bg-surface);
    border: 1px solid var(--border-control);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(var(--shadow-color), 0.18);
    min-width: 160px;
    padding: 6px;
    display: none;
  }
  .dropdown-submenu--open .dropdown-submenu__panel { display: block; }

  .reassign-picker { display: flex; flex-direction: column; gap: 6px; }
  .reassign-picker__option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border-row);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .reassign-picker__option:hover { border-color: var(--border-control); }
  .reassign-picker__option--selected { border-color: var(--accent); background: var(--accent-wash); }
  .reassign-picker__util { font-size: 11px; color: var(--text-secondary); }

  .panel-footer {
    border-top: 1px solid var(--border-row);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-surface);
    flex-shrink: 0;
  }

  .panel-footer__count { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary:hover { background: #0053b3; }
  .btn-primary[disabled] { background: var(--border-control); cursor: not-allowed; }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-strong);
    border: 1px solid var(--border-control);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-row { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- Content ---------- */
  .panel {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    min-width: 0;
  }

  .panel__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 48px;
    border-bottom: 1px solid var(--border-row);
    flex-wrap: wrap;
    gap: 10px;
  }

  .panel__title { margin: 0; font-size: 15px; font-weight: 700; }
  .panel__title-sub { font-size: 12px; font-weight: 400; color: var(--accent); margin-left: 6px; }

  .panel__tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }

  .toggle-group { display: flex; gap: 2px; padding: 2px; background: var(--bg-page); border: 1px solid var(--border-control); border-radius: 8px; }
  .toggle-group__button { padding: 5px 12px; background: none; border: none; border-radius: 6px; font-size: 13px; color: var(--accent); cursor: pointer; display: flex; align-items: baseline; gap: 5px; }
  .toggle-group__button--active { background: var(--bg-surface); box-shadow: 0 1px 1.5px rgba(var(--shadow-color), 0.12); font-weight: 700; color: var(--text-strong); }
  .toggle-group__button-sub { font-size: 10.5px; font-weight: 400; color: var(--text-muted); }

  .search-field { position: relative; display: flex; align-items: center; }
  .search-field .icon { position: absolute; left: 9px; width: 14px; height: 14px; }
  .search-field input { width: 200px; height: 30px; padding: 4px 10px 4px 30px; border: 1px solid var(--border-control); border-radius: 8px; font-size: 13px; color: var(--text-strong); }
  .search-field input::placeholder { color: var(--text-muted); }

  .icon-button {
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 4px 10px;
    background: var(--bg-surface); border: 1px solid var(--border-control); border-radius: 8px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer; position: relative;
  }
  .icon-button__badge {
    background: var(--accent); color: #fff; border-radius: 9999px; font-size: 10px; font-weight: 700;
    padding: 0 5px; line-height: 15px;
  }

  .icon-button--icon-only {
    width: 30px;
    padding: 0;
    justify-content: center;
  }
  .icon-button--icon-only:hover { background: var(--bg-page); color: var(--text-strong); }

  .popover {
    position: absolute;
    top: 36px;
    right: 0;
    z-index: 30;
    background: var(--bg-surface);
    border: 1px solid var(--border-control);
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(var(--shadow-color), 0.18);
    width: 260px;
    max-height: 340px;
    overflow-y: auto;
    padding: 10px;
  }
  .popover--columns { max-height: 440px; }
  .popover__search {
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 8px;
    border: 1px solid var(--border-control);
    border-radius: 6px;
    font-size: 12.5px;
  }
  .popover__row--draggable { cursor: grab; }
  .popover__row--draggable:active { cursor: grabbing; }
  .drag-handle { color: var(--text-muted); font-size: 13px; flex-shrink: 0; }

  .popover__title { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-muted); margin: 4px 0 6px; }
  .popover__row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 12.5px; }
  .popover__row label { display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%; }

  /* ---------- Tables ---------- */
  .table-scroll { overflow-x: auto; max-width: 100%; }
  /* table-layout:auto + width:auto lets the table grow past 100% to fit its
     content (columns never shrink/wrap when more are added) while min-width
     keeps it filling the viewport when content is narrower than that. */
  table { width: auto; min-width: 100%; table-layout: auto; border-collapse: collapse; }

  thead th { background: var(--bg-page); border-bottom: 1px solid var(--border-row); padding: 0 10px 0 12px; height: 34px; text-align: left; white-space: nowrap; }

  .th-sort { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; font-weight: 700; font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; }
  .th-sort .icon { width: 12px; height: 12px; }

  tbody td { padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--border-row); font-size: 13px; color: var(--text-strong); vertical-align: middle; white-space: nowrap; }
  tbody tr { cursor: default; }
  tbody tr:hover td { background: #fafbfc; }
  tbody tr.row--selected td { background: var(--accent-wash); }
  tbody tr.row--clickable { cursor: pointer; }
  tbody tr.row--active td { background: var(--accent-wash); }
  tbody tr.row--active td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

  /* 36px gutter + the 12px cell padding on the next column = 48px, matching the
     page/panel header's 48px inset, so FRO/BOOKING and DRIVER line up with the
     titles above them. */
  .checkbox-cell { width: 36px; text-align: center; position: sticky; left: 0; z-index: 2; }
  thead .checkbox-cell { background: var(--bg-page); z-index: 3; }
  tbody .checkbox-cell { background: var(--bg-surface); }
  tbody tr:hover .checkbox-cell { background: #fafbfc; }
  tr.row--selected .checkbox-cell,
  tr.row--active .checkbox-cell { background: var(--accent-wash); }

  .two-line { display: flex; flex-direction: column; }
  .two-line__primary { font-weight: 700; font-size: 12.5px; }
  .two-line__secondary { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

function froExtra(f, key) {
  switch (key) {
    case "froNumber": return f.froNumber;
    case "bookingNumber": return f.bookingNumber;
    case "containerNumber": return f.containerNumber;
    case "containerSize": return twoLine(f.sizeType, SIZE_LABELS[f.sizeType]);
    case "customer": return twoLine(f.customer, f.customerId);
    case "source": return twoLine(LOCATIONS[f.source].code, LOCATIONS[f.source].name);
    case "destination": return twoLine(LOCATIONS[f.destination].code, LOCATIONS[f.destination].name);
    case "loadStage": return f.load.join(" + ") + " · " + pick(f.id + "stage", ["Gate in", "In yard", "Loaded", "Dispatched"]);
    case "demurrageLfd": return f.demurrage ? twoLine(f.demurrage.time, f.demurrage.date) : '<span class="cell-faint">—</span>';
    case "detentionLfd": return f.detention ? twoLine(f.detention.time, f.detention.date) : '<span class="cell-faint">—</span>';
    case "portApptStart": return twoLine(f.appointmentTime, f.appointmentDate);
    case "portApptEnd": return twoLine(f.appointmentEndTime, f.appointmentDate);
    case "customerAppt": return twoLine(f.appointmentTime, f.appointmentDate);
    case "pin": return "PIN-" + (1000 + (hashStr(f.id) % 9000));
    case "cargoHandling": return pick(f.id + "cargo", ["Live Load", "Live Unload", "Drop & Hook", "—"]);
    case "decoupling": return pick(f.id + "decouple", ["Laden Only", "Empty Only", "Pick Only", "Drop Only", "—"]);
    case "load": return f.load.join(" + ");
    case "chassis": return pick(f.id + "chassis", ["CH-1029", "CH-2044", "CH-3087"]);
    case "vesselArrival": return pick(f.id + "va", ["10 Aug 2026", "11 Aug 2026", "12 Aug 2026"]);
    case "vesselDeparture": return pick(f.id + "vd", ["12 Aug 2026", "13 Aug 2026", "14 Aug 2026"]);
    case "peelPile": return twoLine(pick(f.id + "pp1", ["Peel #12", "Peel #7", "—"]), pick(f.id + "pp2", ["Active", "Closed", "—"]));
    case "greyPool": return pick(f.id + "gp", ["Yes", "No"]);
    case "edo": return "EDO-" + (40000 + (hashStr(f.id) % 9000));
    case "rpn": return "RPN-" + (7000 + (hashStr(f.id) % 900));
    case "containerAvailability": return twoLine(f.appointmentDate, pick(f.id + "avail", ["Available", "Pending"]));
    case "siteCode": return LOCATIONS[f.source].code;
    case "tripType": return pick(f.id + "trip", ["Import", "Export", "Repositioning"]);
    case "billOfLading": return "BOL-" + (500000 + (hashStr(f.id) % 90000));
    default: return "—";
  }
}

/* Move — a derived display column over the separate Load / Cargo Handling /
   Decoupling Service fields. Presentation-only; the underlying fields stay
   independent and remain available via Table Settings. */
function moveDisplay(f) {
  const cargo = froExtra(f, "cargoHandling");
  const decouple = froExtra(f, "decoupling");
  const loadLabel = f.load.join(" + ");
  if (cargo !== "—") {
    const secondary = cargo === "Drop & Hook" && decouple !== "—" ? decouple : null;
    return twoLine(loadLabel + " · " + cargo, secondary);
  }
  if (decouple !== "—") return twoLine(loadLabel + " · " + decouple);
  return twoLine(loadLabel);
}

/* Relevant LFD — a derived display column that shows whichever LFD concept
   actually applies to this FRO's move type, instead of two separate columns. */
function relevantLfdInfo(f) {
  const hasFCL = f.load.includes("FCL");
  const hasECL = f.load.includes("ECL");
  if (hasFCL && hasECL && f.demurrage && f.detention) return { mode: "both", dem: f.demurrage, det: f.detention };
  if (hasECL && !hasFCL && f.detention) return { mode: "single", value: f.detention, label: "Detention" };
  if (f.demurrage) return { mode: "single", value: f.demurrage, label: "Demurrage" };
  if (f.detention) return { mode: "single", value: f.detention, label: "Detention" };
  return { mode: "none" };
}
function relevantLfdDisplay(f) {
  const info = relevantLfdInfo(f);
  if (info.mode === "none") return '<span class="cell-faint">—</span>';
  if (info.mode === "single") {
    return `<div class="two-line"><span class="two-line__primary">${info.value.time}</span><span class="two-line__secondary">${info.value.date}</span><span class="two-line__caption">${info.label}</span></div>`;
  }
  return `<div class="two-line"><span class="two-line__secondary">${info.dem.date} · Demurrage</span><span class="two-line__secondary">${info.det.date} · Detention</span></div>`;
}
function relevantLfdSortValue(f) {
  const info = relevantLfdInfo(f);
  if (info.mode === "none") return "";
  if (info.mode === "single") return info.value.date + info.value.time;
  const a = info.dem.date + info.dem.time, b = info.det.date + info.det.time;
  return a < b ? a : b;
}

function renderAssignmentStatusCell(f) {
  if (f.onHold) {
    return `<span class="status-pill status-pill--warning">On Hold</span> <button type="button" class="link-button-inline" data-release-hold="${f.id}" title="Reason: ${f.holdReason || "Not specified"}">Release Hold</button>`;
  }
  return f.rejectedBy
    ? `<span class="status-pill status-pill--negative">Rejected</span> <button type="button" class="status-info-icon" data-rejected-info="${f.id}" title="Rejected by ${f.rejectedBy}" aria-label="Rejected by ${f.rejectedBy} — click for details">ⓘ</button>`
    : '<span class="status-pill status-pill--neutral">Unassigned</span>';
}

let froSortKey = "relevantLfd";
let froSortAsc = true;

function froMatchesSearch(f, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return f.froNumber.toLowerCase().includes(q) || f.bookingNumber.toLowerCase().includes(q) || f.containerNumber.toLowerCase().includes(q);
}
function froMatchesFilters(f) {
  const flt = STATE.froFilters;
  if (flt.customer.size && !flt.customer.has(f.customer)) return false;
  if (flt.source.size && !flt.source.has(f.source)) return false;
  if (flt.load.size && !flt.load.has(f.load.join("+"))) return false;
  if (flt.priority.size && !flt.priority.has(f.priority)) return false;
  if (flt.assignmentStatus.size && !flt.assignmentStatus.has(f.rejectedBy ? "rejected" : "unassigned")) return false;
  return true;
}
function froMatchesScope(f) {
  const scope = STATE.scope;
  if (scope.customers.size && !scope.customers.has(f.customer)) return false;
  if (scope.locations.size && !scope.locations.has("All Chicago locations")) {
    if (!scope.locations.has(f.source) && !scope.locations.has(f.destination)) return false;
  }
  if (scope.moveTypes.size) {
    const cargo = froExtra(f, "cargoHandling");
    if (!scope.moveTypes.has(cargo)) return false;
  }
  return true;
}
function driverMatchesScope(d) {
  const scope = STATE.scope;
  if (scope.locations.size && !scope.locations.has("All Chicago locations")) {
    if (!scope.locations.has(d.nextLocationName)) return false;
  }
  return true;
}

function renderFroHead() {
  const row = document.getElementById("fro-head-row");
  let html = '<th class="checkbox-cell"></th>';
  html += visibleFroColumns().map((key) => {
    const def = FRO_FIELD_DEFS[key];
    const active = key === froSortKey;
    const icon = active ? (froSortAsc ? ICON_UP : ICON_DOWN) : ICON_SORT;
    return `<th${def.align === "right" ? ' class="align-right"' : ""}><button type="button" class="th-sort" data-sort="${key}">${def.label}${icon}</button></th>`;
  }).join("");
  row.innerHTML = html;
  row.querySelectorAll("[data-sort]").forEach((btn) => btn.addEventListener("click", () => {
    const key = btn.dataset.sort;
    if (key === froSortKey) froSortAsc = !froSortAsc;
    else { froSortKey = key; froSortAsc = true; }
    renderFro();
  }));
}

function froSortValue(f, key) {
  const def = FRO_FIELD_DEFS[key];
  return def ? def.sortValue(f) : "";
}

function renderFroBody() {
  const pool = FROS.filter((f) => f.status !== "assigned");
  let rows = pool.filter((f) => froMatchesSearch(f, STATE.froQuery) && froMatchesFilters(f) && froMatchesScope(f));
  rows = rows.slice().sort((a, b) => {
    const cmp = String(froSortValue(a, froSortKey)).localeCompare(String(froSortValue(b, froSortKey)));
    return froSortAsc ? cmp : -cmp;
  });

  const totalCols = 1 + visibleFroColumns().length;

  if (!rows.length) {
    document.getElementById("fro-body").innerHTML = `<tr class="empty-row"><td colspan="${totalCols}">No freight orders match the current search / filters.</td></tr>`;
    return;
  }

  document.getElementById("fro-body").innerHTML = rows.map((f) => {
    const selected = STATE.selectedFroIds.has(f.id);
    return `
      <tr class="${selected ? "row--selected" : ""}" data-fro-row="${f.id}">
        <td class="checkbox-cell"><input type="checkbox" ${selected ? "checked" : ""} ${f.onHold ? "disabled" : ""} data-select-fro="${f.id}" aria-label="Select ${f.froNumber}" title="${f.onHold ? "Release hold before assigning" : ""}" /></td>
        ${visibleFroColumns().map((key) => {
          const def = FRO_FIELD_DEFS[key];
          return `<td${def.align === "right" ? ' class="align-right"' : ""}>${def.render(f)}</td>`;
        }).join("")}
      </tr>
    `;
  }).join("");

  document.getElementById("fro-body").querySelectorAll("[data-select-fro]").forEach((cb) => {
    cb.addEventListener("click", (e) => e.stopPropagation());
    cb.addEventListener("change", () => {
      const id = cb.dataset.selectFro;
      if (cb.checked) STATE.selectedFroIds.add(id); else STATE.selectedFroIds.delete(id);
      onSelectionChanged();
    });
  });

  document.getElementById("fro-body").querySelectorAll("[data-rejected-info]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasOpen = !!btn.parentElement.querySelector(".popover");

      const fro = FROS.find((f) => f.id === btn.dataset.rejectedInfo);

      pop.style.width = "220px";

        <div class="popover__title">Rejected By</div>
        <div style="padding:2px 2px 8px;font-size:13px;color:var(--text-strong);font-weight:600">${fro.rejectedBy}</div>
        <div class="popover__title">Reason</div>

      `;
      btn.parentElement.style.position = "relative";
      btn.parentElement.appendChild(pop);
    });
  });

  document.getElementById("fro-body").querySelectorAll("[data-release-hold]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      releaseHold(btn.dataset.releaseHold);

/* ============================================================
   COLUMN PERSONALIZATION — shared by Freight Orders and Drivers.
   STATE.*ColumnFullOrder holds every registered column (shown or hidden) in
   one continuous order; STATE.*VisibleKeys says which of them are currently
   shown. Reordering always acts on the full list, so a hidden column keeps
   its place and shows up there the moment it's checked back on.
   ============================================================ */
/* One continuous, always-reorderable column list. `fullOrder` holds every
   registered field (checked or not) in display order; `visibleKeys` is just
   which of them are currently shown. Dragging reorders fullOrder regardless
   of a row's checked state; the checkbox only ever touches visibleKeys. */
function buildColumnSettingsHTML(fullOrder, visibleKeys, fieldDefs) {
  return `
    <input type="text" class="popover__search" placeholder="Search columns" data-col-search />
    <div class="popover__title">Columns</div>
    <div data-column-list>
      ${fullOrder.map((k) => `
        <div class="popover__row popover__row--draggable" draggable="true" data-col-key="${k}">
          <span class="drag-handle" aria-hidden="true">≡</span>
          <label style="flex:1"><input type="checkbox" data-col-toggle="${k}" ${visibleKeys.has(k) ? "checked" : ""}/> ${fieldDefs[k].label}</label>
        </div>
      `).join("")}
    </div>
  `;
}
function wireColumnSettings(pop, fullOrder, visibleKeys, fieldDefs, onChange) {
  const rebuild = () => {
    onChange();
    pop.innerHTML = buildColumnSettingsHTML(fullOrder, visibleKeys, fieldDefs);
    wireColumnSettings(pop, fullOrder, visibleKeys, fieldDefs, onChange);
  };
  pop.querySelectorAll("[data-col-toggle]").forEach((cb) => cb.addEventListener("change", () => {
    const key = cb.dataset.colToggle;
    if (cb.checked) visibleKeys.add(key); else visibleKeys.delete(key);
    rebuild();
  }));
  let dragKey = null;
  pop.querySelectorAll("[data-col-key][draggable]").forEach((row) => {
    row.addEventListener("dragstart", () => { dragKey = row.dataset.colKey; });
    row.addEventListener("dragover", (e) => e.preventDefault());
    row.addEventListener("drop", (e) => {
      e.preventDefault();
      const targetKey = row.dataset.colKey;
      if (!dragKey || dragKey === targetKey) return;
      const from = fullOrder.indexOf(dragKey), to = fullOrder.indexOf(targetKey);
      if (from === -1 || to === -1) return;
      fullOrder.splice(from, 1);
      fullOrder.splice(to, 0, dragKey);
      rebuild();
    });
  });
  const search = pop.querySelector("[data-col-search]");
  if (search) search.addEventListener("input", () => {
    const q = search.value.toLowerCase();

   ============================================================ */
let driverSortKey = "workToday";
let driverSortAsc = false;

document.querySelectorAll("[data-driver-filter]").forEach((btn) => {
  btn.addEventListener("click", () => {
    STATE.driverFilterMode = btn.dataset.driverFilter;
    document.querySelectorAll("[data-driver-filter]").forEach((b) => b.classList.toggle("toggle-group__button--active", b === btn));
    renderDrivers();
  });
});
document.getElementById("drivers-search").addEventListener("input", (e) => { STATE.driverQuery = e.target.value; renderDrivers(); });

function computeRecommendedIds() {
  if (!STATE.selectedFroIds.size) return null;
  const selectedFros = FROS.filter((f) => STATE.selectedFroIds.has(f.id));
  const sourceNames = new Set(selectedFros.map((f) => f.source));
  return new Set(
    DRIVERS.filter((d) => sourceNames.has(d.nextLocationName) && !selectedFros.some((f) => f.rejectedBy === d.name)).map((d) => d.id)
  );
}
function driverMatchesSearch(d, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return d.name.toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || d.externalDriverId.toLowerCase().includes(q) || d.truck.toLowerCase().includes(q);
}
function driverMatchesFilters(d) {
  const flt = STATE.driverFilters;
  if (flt.nextLocation.size && !flt.nextLocation.has(d.nextLocationName)) return false;
  if (flt.vendorType.size && !flt.vendorType.has(d.vendorType)) return false;
  if (flt.fuel.size && !flt.fuel.has(d.fuel)) return false;
  return true;
}

function renderDriversHead() {
  const row = document.getElementById("drivers-head-row");
  let html = '<th class="checkbox-cell"></th>';
  html += visibleDriverColumns().map((key) => {
    const def = DRIVER_FIELD_DEFS[key];
    const active = key === driverSortKey;
    const icon = active ? (driverSortAsc ? ICON_UP : ICON_DOWN) : ICON_SORT;
    const alignClass = def.align === "right" ? "align-right" : def.align === "center" ? "align-center" : "";
    return `<th${alignClass ? ` class="${alignClass}"` : ""}><button type="button" class="th-sort" data-dsort="${key}">${def.label}${icon}</button></th>`;
  }).join("");
  row.innerHTML = html;
  row.querySelectorAll("[data-dsort]").forEach((btn) => btn.addEventListener("click", () => {
    const key = btn.dataset.dsort;
    if (key === driverSortKey) driverSortAsc = !driverSortAsc;
    else { driverSortKey = key; driverSortAsc = true; }
    renderDrivers();
  }));
}

function driverSortValue(d, key) {
  const def = DRIVER_FIELD_DEFS[key];
  return def ? def.sortValue(d) : "";
}

function renderDriversBody() {
  let rows = DRIVERS.filter((d) => driverMatchesSearch(d, STATE.driverQuery) && driverMatchesFilters(d) && driverMatchesScope(d));
  const recommendedIds = computeRecommendedIds();
  const showRecommendedOnly = STATE.driverFilterMode === "recommended" && recommendedIds;

  let title = `Drivers (${DRIVERS.length})`;
  if (STATE.selectedFroIds.size) {
    const shown = showRecommendedOnly ? rows.filter((d) => recommendedIds.has(d.id)) : rows;
    title = `Drivers for Selected Freight (${shown.length})`;
  }
  document.getElementById("drivers-title").textContent = title;

  if (showRecommendedOnly) rows = rows.filter((d) => recommendedIds.has(d.id));

  rows = rows.slice().sort((a, b) => {
    const av = driverSortValue(a, driverSortKey), bv = driverSortValue(b, driverSortKey);
    const cmp = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv));
    return driverSortAsc ? cmp : -cmp;
  });

  const totalCols = 1 + visibleDriverColumns().length;
  const selectedFros = FROS.filter((f) => STATE.selectedFroIds.has(f.id));

  if (!rows.length) {
    const msg = showRecommendedOnly
      ? "No drivers are currently at the selected freight order's location. Switch to All drivers to choose manually."
      : "No drivers match the current search / filters.";
    document.getElementById("drivers-body").innerHTML = `<tr class="empty-row"><td colspan="${totalCols}">${msg}</td></tr>`;
    return;
  }

  document.getElementById("drivers-body").innerHTML = rows.map((d) => {
    const clickable = true;
    const active = STATE.panel.open && STATE.panel.driverId === d.id;
    const previouslyRejected = selectedFros.some((f) => f.rejectedBy === d.name);
    return `
      <tr class="${active ? "row--active" : ""} ${clickable ? "row--clickable" : ""}" data-driver-row="${d.id}">
        <td class="checkbox-cell"></td>
        ${visibleDriverColumns().map((key) => {
          const def = DRIVER_FIELD_DEFS[key];
          const alignClass = def.align === "right" ? "align-right" : def.align === "center" ? "align-center" : "";
          const note = key === "driver" && previouslyRejected ? `<span class="rejected-note">Previously rejected this FRO</span>` : "";
          return `<td${alignClass ? ` class="${alignClass}"` : ""}>${def.render(d)}${note}</td>`;
        }).join("")}
      </tr>
    `;
  }).join("");

  document.getElementById("drivers-body").querySelectorAll("[data-driver-row]").forEach((tr) => {
    tr.addEventListener("click", () => openDriverPanel(tr.dataset.driverRow));
  });
}

const HOURS_PER_ORDER = 1.3;
function projectedPlannedHours(d, extraOrders) {
  return Math.round((d.plannedHours + extraOrders * HOURS_PER_ORDER) * 10) / 10;
}
function hoursRemainingLabel(planned, shift) {
  const remaining = Math.round((shift - planned) * 10) / 10;
  return remaining >= 0 ? `${fmtHours(remaining)} remaining capacity` : `+${fmtHours(Math.abs(remaining))} over capacity`;
}

/* Unified Horizon-style stacked capacity bar: Actual (solid) + Planned (solid) +
   Projected (striped, split at the capacity line into an in-capacity portion and
   an over-capacity portion in warning color). Absolute hours, not percentages. */
function renderCapacityBar(actual, planned, projectedIncrement, capacity) {
  const totalBase = Math.round((actual + planned) * 10) / 10;
  const total = Math.round((totalBase + projectedIncrement) * 10) / 10;
  const scale = Math.max(capacity, total, 0.1);
  const pct = (h) => Math.max(0, (h / scale) * 100);
  const spaceUnderCap = Math.max(0, Math.round((capacity - totalBase) * 10) / 10);
  const projectedUnder = Math.min(projectedIncrement, spaceUnderCap);
  const projectedOver = Math.round((projectedIncrement - projectedUnder) * 10) / 10;
  const overCapacity = Math.max(0, Math.round((total - capacity) * 10) / 10);
  const tickPct = scale > capacity ? pct(capacity) : null;

  return `
    <div class="capacity-bar-outer">
      <div class="capacity-bar">
        ${actual > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--actual" style="width:${pct(actual)}%"></div>` : ""}
        ${planned > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--planned" style="width:${pct(planned)}%"></div>` : ""}
        ${projectedUnder > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--projected" style="width:${pct(projectedUnder)}%"></div>` : ""}
        ${projectedOver > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--over" style="width:${pct(projectedOver)}%"></div>` : ""}
      </div>
      ${tickPct !== null ? `<div class="capacity-bar__tick" style="left:${tickPct}%"><span class="capacity-bar__tick-label">${fmtHours(capacity)}</span></div>` : ""}
    </div>
    <div class="capacity-caption">
      <span>Actual ${fmtHours(actual)} · Planned ${fmtHours(planned)}${projectedIncrement > 0 ? ` · Projected +${fmtHours(projectedIncrement)}` : ""}</span>
    </div>
    ${overCapacity > 0 ? `<div class="capacity-warning">+${fmtHours(overCapacity)} Over Capacity</div>` : ""}
  `;
}

/* Compact Work Today cell for the Drivers table — fixed-width bar so it never
   shifts position between rows regardless of how long the hour labels are. */
function renderCapacityBarCompact(actual, planned, capacity) {
  const total = Math.round((actual + planned) * 10) / 10;
  const overCapacity = Math.max(0, Math.round((total - capacity) * 10) / 10);
  const plannedInCap = Math.round((planned - overCapacity) * 10) / 10;
  const scale = Math.max(capacity, total, 0.1);
  const pct = (h) => Math.max(0, (h / scale) * 100);
  return `
    <div class="worktoday-cell">
      <div class="capacity-bar capacity-bar--compact">
        ${actual > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--actual" style="width:${pct(actual)}%"></div>` : ""}
        ${plannedInCap > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--planned" style="width:${pct(plannedInCap)}%"></div>` : ""}
        ${overCapacity > 0 ? `<div class="capacity-bar__seg capacity-bar__seg--over" style="width:${pct(overCapacity)}%"></div>` : ""}
      </div>
      <div class="worktoday-cell__caption">Actual ${fmtHours(actual)} · Planned ${fmtHours(planned)}${overCapacity > 0 ? ` · <span style="color:var(--warning);font-weight:700">+${fmtHours(overCapacity)} over</span>` : ""}</div>
    </div>
  `;
}

/* Compact Freight Order context for the assignment panel — one card per selected FRO,
   plus the disconnected-sequence check (destination of one leg should match the source
   of the next). This never auto-fixes ordering, just flags it for the dispatcher. */
function renderSelectedFroSummary() {
  const selectedFros = FROS.filter((f) => STATE.selectedFroIds.has(f.id))
    .slice()
    .sort((a, b) => a.appointmentTime.localeCompare(b.appointmentTime));
  if (!selectedFros.length) return "";

  let disconnected = false;
  for (let i = 1; i < selectedFros.length; i++) {
    if (selectedFros[i - 1].destination !== selectedFros[i].source) { disconnected = true; break; }
  }

  const cards = selectedFros.map((f) => `
    <div class="work-item">
      <div>
        <span class="work-item__container">${f.containerNumber}</span>
        <span class="work-item__route">${f.froNumber}</span>
        <span class="work-item__meta">${f.load.join(" + ")} · ${LOCATIONS[f.source].name} → ${LOCATIONS[f.destination].name}</span>
      </div>
    </div>
  `).join("");

  return `
    <div>
      <p class="assigned-section__title">Work Sequence (${selectedFros.length} selected)</p>
      ${cards}
      ${disconnected ? `<div class="inline-note inline-note--warning" style="margin:8px 0 0">These moves do not form a clearly connected sequence.<br>Review the locations and order before assigning.</div>` : ""}
    </div>
  `;
}

function renderAssignmentPanel() {

        <div class="mini-field"><div class="mini-field__label">Next Available</div><div class="mini-field__value">${d.nextAvailable}</div></div>

      </div>

    ${assignMode ? `

  document.getElementById("panel-close-btn").addEventListener("click", closeDriverPanel);

  container.querySelectorAll(".menu-button").forEach((btn) => {

const STATUS_PILL_CLASS = {
  Assigned: "status-pill--neutral",
  Accepted: "status-pill--positive",
  "In Execution": "status-pill--info",
  Executed: "status-pill--positive-subdued",
  Rejected: "status-pill--negative",

function renderWorkItem(d, item) {
  const statusClass = STATUS_PILL_CLASS[item.status] || "status-pill--neutral";
  const executed = item.status === "Executed";
  return `
    <div class="work-item ${executed ? "work-item--executed" : ""}" style="position:relative" title="${item.load} · ${item.source} → ${item.destination}">
      <div>

      </div>
      <button type="button" class="menu-button" data-menu-trigger="${item.id}">⋯</button>
    </div>
  `;
}

function wireWorkItemMenu(d) {
  document.querySelectorAll("[data-submenu-trigger]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const submenu = btn.closest(".dropdown-submenu");
      const isOpen = submenu.classList.contains("dropdown-submenu--open");
      document.querySelectorAll(".dropdown-submenu--open").forEach((el) => el.classList.remove("dropdown-submenu--open"));
      if (!isOpen) submenu.classList.add("dropdown-submenu--open");
    });
  });
  document.querySelectorAll("[data-sim-status]").forEach((btn) => {
    btn.addEventListener("click", () => simulateStatus(d, btn.dataset.simStatus, btn.dataset.status));
  });
  document.querySelectorAll("[data-unassign]").forEach((btn) => {
    if (btn.hasAttribute("disabled")) return;
    btn.addEventListener("click", () => unassignItem(d, btn.dataset.unassign));
  });
  document.querySelectorAll("[data-reassign]").forEach((btn) => {
    if (btn.hasAttribute("disabled")) return;
    btn.addEventListener("click", () => { STATE.panel.reassigning = btn.dataset.reassign; closeAllPopovers(); renderAssignmentPanel(); });
  });
}

/* ---------- Status simulation ---------- */
function simulateStatus(d, itemId, newStatus) {
  const item = d.assignments.find((a) => a.id === itemId);
  if (!item) return;
  const oldStatus = item.status;
  item.status = newStatus;

  if (newStatus === "In Execution") {
    d.nextLocationName = item.destination;
    d.nextAvailable = addMinutes(item.time, 180);
    if (oldStatus !== "In Execution" && oldStatus !== "Executed") {
      // Prototype-only: begin moving a portion of this FRO's mocked hours from
      // Planned into Actual once execution starts. This is an adjustable
      // approximation, not a finalized calculation.
      const moved = Math.round(HOURS_PER_ORDER * 0.3 * 10) / 10;
      d.plannedHours = Math.max(0, Math.round((d.plannedHours - moved) * 10) / 10);
      d.actualHours = Math.round((d.actualHours + moved) * 10) / 10;
    }
  } else if (newStatus === "Executed") {
    d.nextLocationName = item.destination;
    d.nextAvailable = addMinutes(item.time, 240);
    const alreadyMoved = oldStatus === "In Execution" ? Math.round(HOURS_PER_ORDER * 0.3 * 10) / 10 : 0;
    const remaining = Math.round((HOURS_PER_ORDER - alreadyMoved) * 10) / 10;
    d.plannedHours = Math.max(0, Math.round((d.plannedHours - remaining) * 10) / 10);
    d.actualHours = Math.round((d.actualHours + remaining) * 10) / 10;
  } else if (newStatus === "Rejected" && oldStatus !== "Rejected") {
    item.rejectedBy = d.name;
    // Only remove this item's *remaining* (not-yet-executed) hours from Planned — any Actual
    // hours already booked to this driver from earlier completed work are untouched.
    if (oldStatus !== "Executed") {
      const stillPlanned = oldStatus === "In Execution" ? Math.round((HOURS_PER_ORDER - HOURS_PER_ORDER * 0.3) * 10) / 10 : HOURS_PER_ORDER;
      d.plannedHours = Math.max(0, Math.round((d.plannedHours - stillPlanned) * 10) / 10);
    }
    if (item.froId) {
      const fro = FROS.find((f) => f.id === item.froId);
      if (fro) {
        fro.status = "unassigned";
        fro.rejectedBy = d.name;
        fro.rejectedByDriverId = d.id;
        fro.rejectionReason = pick(item.id, REJECTION_REASONS);
        fro.assignedDriverId = null;
      }
    }
    // The item itself stays in d.assignments (visible in the panel as history, clearly
    // marked Rejected) — it just no longer contributes to Planned hours.
    toast(`${item.container} was rejected by ${d.name} and returned to the freight order pool.`);
  }

  closeAllPopovers();
  renderFro();
  renderDrivers();
  renderAssignmentPanel();
}

/* ---------- Unassign ---------- */
function unassignItem(d, itemId) {
  const item = d.assignments.find((a) => a.id === itemId);
  if (!item) return;
  d.assignments = d.assignments.filter((a) => a.id !== itemId);
  d.plannedHours = Math.max(0, Math.round((d.plannedHours - HOURS_PER_ORDER) * 10) / 10);
  if (item.froId) {
    const fro = FROS.find((f) => f.id === item.froId);
    if (fro) { fro.status = "unassigned"; fro.assignedDriverId = null; }
  }
  closeAllPopovers();
  toast(`${item.container} unassigned from ${d.name}.`);
  renderFro();
  renderDrivers();
  renderAssignmentPanel();
}

/* ---------- Reassign ---------- */
function renderReassignPicker(currentDriver) {
  const itemId = STATE.panel.reassigning;
  const item = currentDriver.assignments.find((a) => a.id === itemId);
  const candidates = DRIVERS.filter((d) => d.id !== currentDriver.id);
  return `
    <div class="panel-head">
      <div><p class="panel-head__name">Reassign ${item ? item.container : ""}</p><p class="panel-head__sub">Choose a new driver</p></div>
      <button type="button" class="panel-close" id="panel-close-btn" aria-label="Close panel">✕</button>
    </div>
    <div class="assignment-panel__scroll">
      <div class="reassign-picker">
        ${candidates.map((c) => `
          <div class="reassign-picker__option" data-pick-driver="${c.id}">
            <div>
              <div style="font-weight:700;font-size:13px">${c.name}</div>
              <div class="reassign-picker__util">${c.nextLocationName} · currently ${fmtHours(c.plannedHours)} assigned</div>
            </div>
            <div class="reassign-picker__util">→ ${fmtHours(projectedPlannedHours(c, 1))} assigned</div>
          </div>
        `).join("")}
      </div>
      <div class="reassign-picker__option" data-pick-third-party="1" style="margin-top:10px">
        <div style="font-weight:700;font-size:13px">Assign to Third Party</div>
        <div class="reassign-picker__util">e.g. truck breakdown — hand off to a mocked vendor</div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-secondary" id="cancel-reassign-btn">Cancel</button>
      </div>
    </div>
  `;
}
function wireReassignPicker(currentDriver) {
  document.getElementById("panel-close-btn").addEventListener("click", closeDriverPanel);
  document.getElementById("cancel-reassign-btn").addEventListener("click", () => { STATE.panel.reassigning = null; renderAssignmentPanel(); });
  document.querySelectorAll("[data-pick-driver]").forEach((row) => {
    row.addEventListener("click", () => {
      const newDriver = DRIVERS.find((d) => d.id === row.dataset.pickDriver);
      const itemId = STATE.panel.reassigning;
      const item = currentDriver.assignments.find((a) => a.id === itemId);
      if (!item || !newDriver) return;
      currentDriver.assignments = currentDriver.assignments.filter((a) => a.id !== itemId);
      currentDriver.plannedHours = Math.max(0, Math.round((currentDriver.plannedHours - HOURS_PER_ORDER) * 10) / 10);
      newDriver.assignments.push(item);
      newDriver.plannedHours = projectedPlannedHours(newDriver, 1);
      if (item.froId) {
        const fro = FROS.find((f) => f.id === item.froId);
        if (fro) fro.assignedDriverId = newDriver.id;
      }
      toast(`${item.container} reassigned to ${newDriver.name}.`);
      STATE.panel.reassigning = null;
      STATE.panel.driverId = newDriver.id;
      STATE.panel.mode = "inspect";
      renderFro();
      renderDrivers();
      renderAssignmentPanel();
    });
  });
  const thirdPartyRow = document.querySelector("[data-pick-third-party]");
  if (thirdPartyRow) {
    thirdPartyRow.addEventListener("click", () => {
      const itemId = STATE.panel.reassigning;
      const item = currentDriver.assignments.find((a) => a.id === itemId);
      if (!item) return;
      currentDriver.assignments = currentDriver.assignments.filter((a) => a.id !== itemId);
      currentDriver.plannedHours = Math.max(0, Math.round((currentDriver.plannedHours - HOURS_PER_ORDER) * 10) / 10);
      if (item.froId) {
        const fro = FROS.find((f) => f.id === item.froId);
        if (fro) { fro.assignedDriverId = null; fro.thirdPartyVendor = THIRD_PARTY_VENDORS[0]; }
      }
      toast(`${item.container} handed off to ${THIRD_PARTY_VENDORS[0]} (third party).`);
      STATE.panel.reassigning = null;
      renderFro();
      renderDrivers();
      renderAssignmentPanel();
    });
  }
}

/* ---------- Confirm assign ---------- */
function confirmAssign(d) {
  const ids = Array.from(STATE.selectedFroIds);
  if (!ids.length) return;
  ids.forEach((id) => {
    const fro = FROS.find((f) => f.id === id);
    if (!fro || fro.onHold) return;
    fro.status = "assigned";
    fro.assignedDriverId = d.id;
    fro.rejectedBy = null;
    d.assignments.push({
      id: uid("wk"),
      froId: fro.id,
      container: fro.containerNumber,
      load: fro.load.join(" + "),
      source: LOCATIONS[fro.source].name,
      destination: LOCATIONS[fro.destination].name,
      time: fro.appointmentTime,
      status: "Assigned",
      rejectedBy: null,
    });
  });
  d.plannedHours = projectedPlannedHours(d, ids.length);
  toast(`${ids.length} freight order${ids.length > 1 ? "s" : ""} assigned to ${d.name}.`);
  STATE.selectedFroIds.clear();
  STATE.driverFilterMode = "all";
  syncDriverToggleUI();
  STATE.panel.mode = "inspect";
  renderFro();
  renderDrivers();
  renderAssignmentPanel();
}

/* ============================================================
   FALLOUT / MORNING RECONCILIATION — prototype-only exception queue
   ============================================================ */
let falloutPanelOpen = false;
let falloutSelected = new Set();

function renderFalloutBanner() {
  const host = document.getElementById("fallout-banner");
  if (!STATE.fallout.length) {
    host.innerHTML = "";
    falloutPanelOpen = false;
    return;
  }
  const previousDate = STATE.fallout[0].previousDate;
  host.innerHTML = `
    <div class="fallout-banner">
      <span>${STATE.fallout.length} freight order${STATE.fallout.length > 1 ? "s" : ""} from ${previousDate} require reconciliation.</span>
      <button type="button" class="btn-secondary" id="review-fallout-btn">${falloutPanelOpen ? "Hide" : "Review"}</button>
    </div>
    ${falloutPanelOpen ? renderFalloutPanel() : ""}
  `;
  document.getElementById("review-fallout-btn").addEventListener("click", () => {
    falloutPanelOpen = !falloutPanelOpen;
    if (falloutPanelOpen) falloutSelected = new Set();
    renderFalloutBanner();
  });
  if (falloutPanelOpen) wireFalloutPanel();
}

function renderFalloutPanel() {
  const eligibleCount = STATE.fallout.filter((f) => f.previousStatus !== "In Execution").length;
  return `
    <div class="fallout-panel">
      <div class="fallout-panel__toolbar">
        <p class="fallout-panel__title">Unresolved from ${STATE.fallout[0].previousDate} — In Execution items need individual review.</p>
        <button type="button" class="btn-secondary" id="fallout-select-all" ${eligibleCount === 0 ? "disabled" : ""}>Select All Eligible</button>
      </div>
      ${STATE.fallout.map((f) => {
        const inExecution = f.previousStatus === "In Execution";
        return `
        <div class="fallout-row">
          <input type="checkbox" data-fallout-check="${f.id}" ${falloutSelected.has(f.id) ? "checked" : ""} ${inExecution ? "disabled" : ""} aria-label="Select ${f.container}" />
          <div class="fallout-row__main">
            <span class="fallout-row__container">${f.container}</span>
            <span class="fallout-row__meta">Previously ${f.driverName} · ${f.previousDate}</span>
            <span class="status-pill ${STATUS_PILL_CLASS[f.previousStatus] || "status-pill--neutral"}">${f.previousStatus}</span>
          </div>
          <div class="fallout-row__actions" style="position:relative">
            <button type="button" class="menu-button" data-fallout-menu="${f.id}" aria-label="More actions">⋯</button>
          </div>
        </div>
      `;
      }).join("")}
      <div class="fallout-panel__footer">
        <span class="panel-footer__count">${falloutSelected.size} selected</span>
        <button type="button" class="btn-primary" id="fallout-bulk-return" ${falloutSelected.size === 0 ? "disabled" : ""}>Return to Pool</button>
      </div>
    </div>
  `;
}

function wireFalloutPanel() {
  document.querySelectorAll("[data-fallout-check]").forEach((cb) => {
    cb.addEventListener("change", () => {
      if (cb.checked) falloutSelected.add(cb.dataset.falloutCheck); else falloutSelected.delete(cb.dataset.falloutCheck);
      renderFalloutBanner();
    });
  });
  const selectAllBtn = document.getElementById("fallout-select-all");
  if (selectAllBtn) selectAllBtn.addEventListener("click", () => {
    falloutSelected = new Set(STATE.fallout.filter((f) => f.previousStatus !== "In Execution").map((f) => f.id));
    renderFalloutBanner();
  });
  const bulkBtn = document.getElementById("fallout-bulk-return");
  if (bulkBtn) bulkBtn.addEventListener("click", () => {
    const ids = Array.from(falloutSelected);
    ids.forEach((id) => returnFalloutToPool(id, { silent: true }));
    falloutSelected = new Set();
    toast(`${ids.length} freight order${ids.length > 1 ? "s" : ""} returned to the pool.`);
    renderFalloutBanner();
  });
  document.querySelectorAll("[data-fallout-menu]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasOpen = !!btn.parentElement.querySelector(".dropdown-menu");
      closeAllPopovers();
      if (wasOpen) return;
      const f = STATE.fallout.find((x) => x.id === btn.dataset.falloutMenu);
      btn.insertAdjacentHTML("afterend", `
        <div class="dropdown-menu">
          <button type="button" class="dropdown-menu__item" data-return-fallout="${f.id}">Return to Pool</button>
          <button type="button" class="dropdown-menu__item" data-keep-fallout="${f.id}">Keep Assignment</button>
        </div>
      `);
      document.querySelector(`[data-return-fallout="${f.id}"]`).addEventListener("click", () => { closeAllPopovers(); returnFalloutToPool(f.id); });
      document.querySelector(`[data-keep-fallout="${f.id}"]`).addEventListener("click", () => { closeAllPopovers(); keepFalloutAssignment(f.id); });
    });
  });
}

function returnFalloutToPool(id, opts) {
  const entry = STATE.fallout.find((f) => f.id === id);
  if (!entry) return;
  if (entry.froId) {
    const fro = FROS.find((f) => f.id === entry.froId);
    if (fro) { fro.status = "unassigned"; fro.assignedDriverId = null; fro.fallout = false; }
  }
  STATE.fallout = STATE.fallout.filter((f) => f.id !== id);
  if (!opts || !opts.silent) toast(`${entry.container} returned to the freight order pool for ${STATE.planningDate}.`);
  renderFro();
  renderFalloutBanner();
}

function keepFalloutAssignment(id) {
  const entry = STATE.fallout.find((f) => f.id === id);
  if (!entry) return;
  const driver = DRIVERS.find((d) => d.id === entry.driverId);
  if (driver) {
    driver.assignments.push({
      id: uid("wk"),
      froId: entry.froId,
      container: entry.container,
      load: "",
      source: "",
      destination: "",
      time: "",
      status: entry.previousStatus,
      rejectedBy: null,
    });
    driver.plannedHours = Math.round((driver.plannedHours + HOURS_PER_ORDER) * 10) / 10;
    if (entry.froId) {
      const fro = FROS.find((f) => f.id === entry.froId);
      if (fro) fro.fallout = false;
    }
  }
  STATE.fallout = STATE.fallout.filter((f) => f.id !== id);
  toast(`${entry.container} kept on ${entry.driverName}'s plan (prototype hypothesis — not a confirmed rule).`);
  renderDrivers();
  if (STATE.panel.open && STATE.panel.driverId === entry.driverId) renderAssignmentPanel();
  renderFalloutBanner();
}

/* ============================================================
   PLANNING DATE — prototype-only daily refresh
   ============================================================ */
function resetArrayContents(arr, snapshot) {
  arr.length = 0;
  arr.push(...JSON.parse(JSON.stringify(snapshot)));
}
function refreshForPlanningDate(dateStr) {
  closeAllPopovers();
  const openDriverId = STATE.panel.open ? STATE.panel.driverId : null;
  STATE.selectedFroIds.clear();
  STATE.driverFilterMode = "all";
  STATE.panel.mode = "inspect";

  const previousDate = STATE.planningDate;
  STATE.planningDate = dateStr;

  if (dateStr === DEFAULT_PLANNING_DATE) {
    resetArrayContents(FROS, INITIAL_FROS_SNAPSHOT);
    resetArrayContents(DRIVERS, INITIAL_DRIVERS_SNAPSHOT);
    STATE.fallout = [];
  } else if (dateStr !== previousDate) {
    // Prototype-only "next day" mock transition (engineer refinement scenario):
    // today's Actual Today resets to 0, executed work drops off (it's done and no
    // longer "planned"). Unfinished Assigned/Accepted/In Execution work does NOT
    // silently carry over and does NOT silently vanish — it becomes a morning
    // reconciliation "fallout" item the dispatcher must explicitly resolve
    // (Return to Pool / Keep Assignment). This also naturally covers the
    // cross-midnight "still In Execution" edge case with no special-case code.
    // This is a hard-coded demo transform, not a production rollover engine.
    DRIVERS.forEach((d) => {
      d.actualHours = 0;
      const carried = [];
      d.assignments.forEach((a) => {
        if (a.status === "Rejected") return;
        if (a.status === "Executed") {
          d.plannedHours = Math.max(0, Math.round((d.plannedHours - HOURS_PER_ORDER) * 10) / 10);
          return;
        }
        // Unresolved (Assigned / Accepted / In Execution) — park it as fallout.
        d.plannedHours = Math.max(0, Math.round((d.plannedHours - HOURS_PER_ORDER) * 10) / 10);
        if (a.froId) {
          const fro = FROS.find((f) => f.id === a.froId);
          if (fro) fro.fallout = true;
        }
        STATE.fallout.push({
          id: uid("fallout"),
          froId: a.froId,
          container: a.container,
          driverId: d.id,
          driverName: d.name,
          previousStatus: a.status,
          previousDate,
        });
      });
      d.assignments = carried;
    });
  }

  syncDriverToggleUI();
  falloutPanelOpen = false;
  renderFro();
  renderDrivers();
  renderFalloutBanner();

  if (openDriverId && DRIVERS.some((d) => d.id === openDriverId)) {
    STATE.panel.open = true;
    STATE.panel.driverId = openDriverId;
    renderAssignmentPanel();
    renderDriversBody();
  } else {
    closeDriverPanel();
  }
}
const TOMORROW_PLANNING_DATE = "2026-08-15";
document.querySelectorAll("#day-toggle [data-day]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#day-toggle [data-day]").forEach((b) => b.classList.toggle("toggle-group__button--active", b === btn));
    refreshForPlanningDate(btn.dataset.day === "tomorrow" ? TOMORROW_PLANNING_DATE : DEFAULT_PLANNING_DATE);
  });
});

/* ============================================================
   INIT
   ============================================================ */
renderFro();
renderDrivers();
renderFalloutBanner();
</script>
